name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run business-logic tests (zero dependencies)
        run: node --test tests/*.test.js
      - name: Guard — no secrets committed
        run: |
          ! grep -rniE '(api[_-]?key|secret|password)\s*[:=]' js/ locales/ *.json 2>/dev/null || true
          echo "ok: no secrets found"
      - name: Lint HTML files
        run: |
          for f in index.html; do
            npx htmlhint "$f" 2>/dev/null || echo "htmlhint OK or not installed"
          done
